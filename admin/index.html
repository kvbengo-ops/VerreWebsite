<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verre Studio Admin</title>
  <meta name="theme-color" content="#F157A8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside>
      <a class="brand" href="/admin/#dashboard"><span>V</span> Verre studio</a>
      <nav aria-label="Admin">
        <a href="#dashboard" data-route="dashboard" data-roles="super_admin">Dashboard</a>
        <a href="#products" data-route="products" data-roles="super_admin">Products</a>
        <a href="#inventory" data-route="inventory" data-roles="super_admin general_admin">Inventory</a>
        <a href="#orders" data-route="orders" data-roles="super_admin general_admin">Orders</a>
        <a href="#custom" data-route="custom" data-roles="super_admin general_admin">Custom orders</a>
        <a href="/pos" data-roles="super_admin general_admin">Open POS ↗</a>
        <a href="#sessions" data-route="sessions" data-roles="super_admin">Sessions</a>
        <a href="#markets" data-route="markets" data-roles="super_admin">Upcoming markets</a>
        <a href="#themes" data-route="themes" data-roles="super_admin">Seasons</a>
        <a href="#accounts" data-route="accounts" data-roles="super_admin">Accounts</a>
      </nav>
      <div class="account"><small>Signed in as</small><strong id="account-email">Checking…</strong><span id="account-role" class="role-badge">Checking role…</span><button type="button" id="sign-out" class="linklike">Sign out</button></div>
    </aside>
    <!-- First paint, before app.js runs. A skeleton of roughly the right shape
         rather than a centred line of text, so the very first frame is already
         the size the page will settle at. -->
    <main id="main" tabindex="-1" aria-busy="true">
      <div class="page-head">
        <div class="skeleton sk-line" style="width:130px;height:11px"></div>
        <div class="skeleton sk-line" style="width:min(340px,60%);height:38px;margin-top:10px"></div>
      </div>
      <div class="grid metrics">
        <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
        <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
      </div>
      <div class="skeleton" style="height:230px;border-radius:22px"></div>
      <span class="sr-only">Loading the studio…</span>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><button class="modal-close" aria-label="Close dialog">×</button><div id="modal-body"></div></dialog>
  <dialog id="delete-product-modal" class="danger-modal" aria-labelledby="delete-product-title" aria-describedby="delete-product-description">
    <div id="delete-product-modal-body"></div>
  </dialog>
  <script type="module" src="/admin/app.js"></script>
</body>
</html>
