# Must match the deployed Worker exactly — it is the subdomain in
# verrewebsite.kvb-engo.workers.dev. `wrangler secret put` and `wrangler deploy`
# both target this name, so a mismatch quietly creates a second, empty Worker
# and puts your secrets on it while the live one stays unconfigured.
name = "verrewebsite"
main = "dist/server/index.js"
compatibility_date = "2025-05-01"

# The *.workers.dev origin is on, which is how this deploys before a domain
# exists.
#
# It was off while admin auth depended on a trusted header from a dispatcher:
# that hostname has no dispatcher in front of it, so it was an unprotected door
# into /admin and /pos. It is not any more. Authentication is a session cookie
# checked by the Worker itself, on every hostname, so workers.dev is exactly as
# protected as the real domain will be.
#
# Turn this back off once a custom domain and a route are in place — a second
# public origin is still a second thing to think about, and search engines will
# index it.
workers_dev = true

# Runtime values managed in the Cloudflare dashboard must survive CI deploys.
# Without this, `wrangler deploy` replaces dashboard plaintext variables with
# only the values declared below, leaving production without Supabase access.
keep_vars = true

# Non-secret configuration. Anything here is committed to git, so nothing that
# grants access belongs in this block — SUPABASE_SERVICE_ROLE_KEY and
# RESEND_API_KEY go through `wrangler secret put`, never here.
[vars]
LOCAL_AUTH_BYPASS = "false"

# Optional caches. Create them with:
#   npx wrangler kv namespace create CATALOG_CACHE
# then paste the printed id below and uncomment. The site works without them;
# it just reads Supabase more often. AUTH_LIMITS is the one worth doing first —
# without it, login rate limiting falls back to an in-memory map that resets
# whenever Cloudflare recycles the isolate.
# [[kv_namespaces]]
# binding = "AUTH_LIMITS"
# id = ""
# [[kv_namespaces]]
# binding = "CATALOG_CACHE"
# id = ""
# [[kv_namespaces]]
# binding = "DASHBOARD_CACHE"
# id = ""

# Run `npm run build` first — both of these point at build output.
[assets]
directory = "dist/client"
binding = "ASSETS"
# Without this, Cloudflare serves any matching static file BEFORE the Worker
# runs, so the auth check in src/worker.js never sees a request for
# /admin/app.js or /pos/sw.js and the whole console is downloadable.
#
# "/" and "/index.html" are here for a different reason: the Worker injects the
# active season into the page before it is sent. Served straight off the asset
# layer, that code never runs and the storefront renders undressed all year —
# which is exactly what it did until this line changed. The Worker still hands
# the request to ASSETS, so the page itself is unchanged; it just passes through
# one function first.
#
# The bare paths are listed separately — "/admin/*" does not match "/admin",
# which otherwise gets a 307 directory redirect from the asset layer instead of
# the 401 everything else under it returns.
run_worker_first = ["/", "/index.html", "/products/*", "/media/products/*", "/robots.txt", "/sitemap.xml", "/admin", "/admin/*", "/pos", "/pos/*"]
