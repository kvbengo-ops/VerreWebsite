name = "verre"
main = "dist/server/index.js"
compatibility_date = "2025-05-01"

# Run `npm run build` first — both of these point at build output.
[assets]
directory = "dist/client"
binding = "ASSETS"
# Without this, Cloudflare serves any matching static file BEFORE the Worker
# runs, so the auth check in src/worker.js never sees a request for
# /admin/app.js or /pos/sw.js and the whole console is downloadable.
# The storefront is deliberately not listed — it must stay fast and public.
# The bare paths are listed separately — "/admin/*" does not match "/admin",
# which otherwise gets a 307 directory redirect from the asset layer instead of
# the 401 everything else under it returns.
run_worker_first = ["/admin", "/admin/*", "/pos", "/pos/*"]
